name: HackersJack Statistical Reproducibility

on:
  push:
    paths:
      - "scripts/**"
      - "data/raw_assessment_data/**"
      - "requirements.txt"
      - ".github/workflows/reproduce-results.yml"

  workflow_dispatch:

jobs:
  reproduce-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Excel datasets
        run: |
          python -c "from pathlib import Path; files=[p for p in Path('data/raw_assessment_data').glob('*.xlsx') if not p.name.startswith('~$')]; print(f'Found {len(files)} Excel workbooks'); assert len(files)==12, 'Expected 12 workbooks'"

      - name: Reproduce statistical results
        run: |
          python scripts/pipeline.py \
            --input data/raw_assessment_data \
            --output outputs

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HackersJack-Statistical-Verification
          path: |
            outputs/statistical_results.csv
            outputs/verification.csv
            outputs/data_quality_counts.csv
            outputs/source_checksums.json
          if-no-files-found: warn
